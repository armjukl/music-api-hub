[project]
name = "music-api-hub"
version = "0.1.0"
description = "A unified FastAPI gateway for spotDL and Bilibili music sources"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
    "fastapi>=0.103,<0.104",
    "httpx>=0.27,<0.28",
    "python-dotenv>=1,<2",
    "spotdl>=4.5.2,<5",
    "uvicorn[standard]>=0.23.2,<0.24",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
